services:
  - type: web
    name: carpediem-baskin
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: APP_NAME
        value: CarpeDiem Baskin
      - key: DATABASE_URL
        sync: false
      - key: STAFF_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
