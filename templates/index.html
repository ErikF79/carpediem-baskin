<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F58220" />
  <title>CarpeDiem Baskin</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/static/assets/carpediem.png" />
  <link rel="apple-touch-icon" href="/static/assets/carpediem.png" />
  <link rel="stylesheet" href="/static/css/style.css?v=18" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__brand">
      <img class="topbar__logo" src="/static/assets/carpediem.png" alt="CarpeDiem Baskin" />
      <div class="topbar__titles">
        <span class="topbar__title" id="appName">CarpeDiem Baskin</span>
        <span class="topbar__subtitle">Calendario impegni squadra</span>
      </div>
    </div>
    <nav class="topbar__nav">
      <button class="tab is-active" data-view="calendar">Calendario</button>
      <button class="tab" data-view="agenda">Agenda</button>
      <button class="tab" data-view="roster">Squadra</button>
      <button class="tab" id="staffTab" data-view="admin" hidden>Gestione</button>
    </nav>
    <div class="topbar__actions">
      <button class="iconbtn" id="themeToggle" title="Cambia tema" aria-label="Cambia tema">🌙</button>
      <button class="iconbtn" id="staffToggle" title="Area staff" aria-label="Area staff">🔒</button>
    </div>
  </header>

  <div class="filters" id="filters">
    <div class="segmented" id="fedFilter">
      <button class="seg is-active" data-fed="">Tutti</button>
      <button class="seg" data-fed="EISI">EISI</button>
      <button class="seg" data-fed="CSAIN">CSAIN</button>
    </div>
    <button class="btn btn--ghost" id="todayBtn">Oggi</button>
  </div>

  <main class="content">
    <section id="calendarView" class="view"></section>
    <section id="agendaView" class="view is-hidden"></section>
    <section id="rosterView" class="view is-hidden"></section>
    <section id="adminView" class="view is-hidden"></section>
  </main>

  <footer class="footer">
    <div class="footer__nbi">
      <img src="/static/assets/nbi.png" alt="Nuova Basket Isonzo" />
      <span>Progetto Baskin supportato da <strong>ASD Nuova Basket Isonzo</strong></span>
    </div>
    <div class="footer__fed" id="footerFeds"></div>
  </footer>

  <div class="modal" id="iconModal" aria-hidden="true" style="display:none;">
    <div class="modal__backdrop" onclick="closeIconModal()"></div>
    <div class="modal__panel" style="max-width:420px;">
      <button class="modal__close" onclick="closeIconModal()" aria-label="Chiudi">✕</button>
      <h3 id="iconModalTitle" style="font-weight:800;font-size:1.1rem;color:var(--text);margin-bottom:8px;"></h3>
      <div id="iconModalBody" style="font-size:.9rem;color:var(--muted);line-height:1.5;"></div>
    </div>
  </div>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__backdrop" data-close></div>
    <div class="modal__panel">
      <button class="modal__close" data-close aria-label="Chiudi">✕</button>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="/static/js/app.js?v=18"></script>
  <script src="/static/js/admin.js?v=18"></script>
</body>
</html>
