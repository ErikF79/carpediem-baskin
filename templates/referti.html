<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#0a0c10" />
  <title>Referti staff · CarpeDiem Baskin</title>
  <link rel="icon" href="/static/assets/carpediem.png" />
  <link rel="stylesheet" href="/static/css/reports.css?v=3" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #0a0c10;
      color: #f4f6f9;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    .staffbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 20px;
      background: #0f131a;
      border-bottom: 1px solid rgba(255, 255, 255, .09);
    }
    .staffbar__brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
      min-width: 0;
    }
    .staffbar__brand img { width: 38px; height: 38px; object-fit: contain; }
    .staffbar__brand strong { display: block; font-size: .95rem; letter-spacing: .2px; }
    .staffbar__brand span { display: block; font-size: .72rem; color: #93a0b1; }
    .staffbar__actions { display: flex; align-items: center; gap: 10px; }
    .staffbar__badge {
      font-size: .66rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #ffa64d;
      border: 1px solid rgba(245, 130, 32, .4);
      background: rgba(245, 130, 32, .12);
      padding: 5px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .staffbar__btn {
      border: 1px solid rgba(255, 255, 255, .18);
      background: transparent;
      color: #f4f6f9;
      padding: 7px 14px;
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      font-size: .8rem;
      cursor: pointer;
    }
    .staffbar__btn:hover { border-color: #f58220; color: #ffa64d; }
    .staffmain { max-width: 1440px; margin: 0 auto; padding: 20px; }
    .staff-login {
      max-width: 430px;
      margin: 8vh auto 0;
      background: #131820;
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .45);
    }
    .staff-login__icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: rgba(245, 130, 32, .14);
      border: 1px solid rgba(245, 130, 32, .35);
      font-size: 1.4rem;
      margin-bottom: 16px;
    }
    .staff-login h1 { margin: 0 0 6px; font-size: 1.35rem; }
    .staff-login p { margin: 0 0 18px; color: #93a0b1; font-size: .86rem; line-height: 1.5; }
    .staff-login label {
      display: block;
      font-size: .68rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #93a0b1;
      margin-bottom: 7px;
    }
    .staff-login input {
      width: 100%;
      box-sizing: border-box;
      background: #1a212b;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 11px;
      color: #f4f6f9;
      font: inherit;
      padding: 12px 13px;
      margin-bottom: 14px;
    }
    .staff-login input:focus { outline: 2px solid rgba(245, 130, 32, .55); outline-offset: 1px; border-color: #f58220; }
    .staff-login button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      padding: 12px 16px;
      font: inherit;
      font-weight: 800;
      color: #12151a;
      background: linear-gradient(135deg, #ffa64d, #f58220);
      cursor: pointer;
    }
    .staff-login button:disabled { opacity: .6; cursor: default; }
    .staff-login__error {
      margin: 12px 0 0 !important;
      color: #ff8a94 !important;
      font-size: .82rem !important;
      min-height: 1.2em;
    }
    .staff-login__hint {
      margin-top: 18px !important;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, .09);
      font-size: .74rem !important;
    }
    .staff-login__hint a { color: #ffa64d; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translate(-50%, 20px);
      background: #1a212b;
      border: 1px solid rgba(245, 130, 32, .45);
      color: #f4f6f9;
      padding: 11px 18px;
      border-radius: 999px;
      font-size: .84rem;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 60;
      max-width: min(90vw, 520px);
      text-align: center;
    }
    .toast.is-visible { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 640px) {
      .staffmain { padding: 12px; }
      .staffbar { padding: 10px 14px; }
      .staffbar__badge { display: none; }
    }
  </style>
</head>
<body class="is-reports">
  <header class="staffbar">
    <a class="staffbar__brand" href="/">
      <img src="/static/assets/carpediem.png" alt="CarpeDiem Baskin" />
      <div>
        <strong>CarpeDiem Baskin</strong>
        <span>Area riservata staff</span>
      </div>
    </a>
    <div class="staffbar__actions">
      <span class="staffbar__badge">Solo staff</span>
      <button class="staffbar__btn" id="staffLogout" type="button" hidden>Esci</button>
    </div>
  </header>

  <main class="staffmain">
    <section class="staff-login" id="staffLogin" hidden>
      <div class="staff-login__icon" aria-hidden="true">🔒</div>
      <h1>Referti &amp; statistiche</h1>
      <p>Pagina riservata allo staff. Inserisci la password per consultare referti e statistiche della stagione.</p>
      <form id="staffLoginForm" autocomplete="on">
        <label for="staffPassword">Password staff</label>
        <input id="staffPassword" name="password" type="password" autocomplete="current-password" required />
        <button id="staffLoginBtn" type="submit">Accedi</button>
        <p class="staff-login__error" id="staffLoginError" role="alert"></p>
      </form>
      <p class="staff-login__hint">Non sei dello staff? Torna al <a href="/">calendario pubblico</a>.</p>
    </section>

    <section id="reportsView" hidden></section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    window.CarpeDiemAPI = "";
  </script>
  <script src="/static/js/reports.js?v=3"></script>
  <script src="/static/js/referti.js?v=1"></script>
</body>
</html>
